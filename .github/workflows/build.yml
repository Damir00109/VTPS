name: Build Vanilla+ TPS

on:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Extract mod version and minecraft version
        id: version
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d "'\" ")
          MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2 | tr -d "'\" ")
          echo "MOD_VERSION=${MOD_VERSION}" >> $GITHUB_OUTPUT
          echo "MC_VERSION=${MC_VERSION}" >> $GITHUB_OUTPUT

      - name: Get commit message
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "COMMIT_MSG=${COMMIT_MSG}" >> $GITHUB_OUTPUT

      - name: Find existing tags and calculate release number
        id: tags
        run: |
          git fetch --tags
          BASE_TAG="v${{ steps.version.outputs.MOD_VERSION }}"
          COUNT=1
          while git rev-parse "$BASE_TAG#$COUNT" >/dev/null 2>&1; do
            ((COUNT++))
          done
          echo "RELEASE_TAG=${BASE_TAG}#${COUNT}" >> $GITHUB_OUTPUT
          echo "RELEASE_NUMBER=${COUNT}" >> $GITHUB_OUTPUT
          echo "Using tag: ${BASE_TAG}#${COUNT}"

      - name: Create Git tag
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ steps.tags.outputs.RELEASE_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build mod
        run: ./gradlew build

      - name: Find built jar
        id: jar
        run: |
          # Исключаем и -dev.jar, и -sources.jar, чтобы выбрать только чистый мод
          JAR_PATH=$(ls build/libs/*.jar | grep -v '\-dev\.jar' | grep -v '\-sources\.jar' | head -1)
          echo "JAR_PATH=${JAR_PATH}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.tags.outputs.RELEASE_TAG }}"
          name: "Vanilla+ TPS ${{ steps.version.outputs.MOD_VERSION }}"
          # Используем точный путь к JAR
          files: ${{ steps.jar.outputs.JAR_PATH }}
          draft: false
          generate_release_notes: true

      - name: Publish to Modrinth
        run: |
          JAR_PATH="${{ steps.jar.outputs.JAR_PATH }}"
          JAR_NAME=$(basename "$JAR_PATH")
          curl --fail -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${{ secrets.MODRINTH_TOKEN }}" \
            -F "data={
              \"name\": \"Vanilla+ TPS ${{ steps.version.outputs.MOD_VERSION }}\",
              \"version_number\": \"${{ steps.version.outputs.MOD_VERSION }}\",
              \"changelog\": \"${{ steps.commit.outputs.COMMIT_MSG }}\",
              \"dependencies\": [],
              \"game_versions\": [\"${{ steps.version.outputs.MC_VERSION }}\"],
              \"version_type\": \"release\",
              \"loaders\": [\"fabric\"],
              \"featured\": true,
              \"status\": \"listed\",\
              \"project_id\": \"OgsODby2\",\
              \"file_parts\": [\"file\"], \
              \"primary_file\": \"file\" \
            };type=application/json" \
            -F "file=@${JAR_PATH};filename=${JAR_NAME};type=application/java-archive"
